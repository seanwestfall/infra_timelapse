name: Deploy Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pages:
        description: Deploy the static Pages frontend
        required: true
        default: auto
        type: choice
        options: [auto, always, never]

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm install

      - run: npm test

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -p 'test_*.py'

      - run: npm run build

      - run: npm run validate:worker

      - name: Deploy Worker and conditionally deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_PAGES_BRANCH: ${{ github.head_ref || 'main' }}
          TIMELAPSE_API_BASE: ${{ vars.TIMELAPSE_API_BASE }}
          EVENT_BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_PAGES: ${{ inputs.pages }}
        run: |
          pages_mode="${INPUT_PAGES:-auto}"
          worker_mode="always"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pages_mode="always"
            worker_mode="never"
          fi
          bash deploy/deploy_cloudflare.sh \
            --pages "${pages_mode}" \
            --worker "${worker_mode}" \
            --base-ref "${EVENT_BEFORE}" \
            --head-ref "${EVENT_SHA}"

      - name: Publish preview address
        if: github.event_name == 'pull_request'
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
        run: |
          branch_alias="$(printf '%s' "${PREVIEW_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
          project="${PAGES_PROJECT:-infra-timelapse}"
          echo "### Cloudflare Pages preview" >> "${GITHUB_STEP_SUMMARY}"
          echo "https://${branch_alias}.${project}.pages.dev" >> "${GITHUB_STEP_SUMMARY}"
