<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="confirm-url" content="__CONFIRM_URL__">
  <title>Confirm access · Infra Timelapse Explorer</title>
  <style>
    :root { color-scheme:dark; --ink:#f8fafc; --muted:#94a3b8; --teal:#2dd4bf; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem; color:var(--ink); background:radial-gradient(circle at 50% 0,#134e4a 0,transparent 34rem),#030712; font-family:ui-sans-serif,system-ui,sans-serif; }
    main { width:min(34rem,100%); border:1px solid #334155; border-radius:1rem; padding:clamp(1.5rem,6vw,3.5rem); background:rgb(15 23 42/.9); box-shadow:0 2rem 5rem rgb(0 0 0/.35); }
    .mark { width:3rem; height:3rem; display:grid; place-items:center; border-radius:50%; color:#042f2e; background:var(--teal); font-weight:900; }
    h1 { margin:1.5rem 0 .8rem; font-size:clamp(2rem,8vw,3.5rem); line-height:1; letter-spacing:-.05em; }
    p { color:var(--muted); line-height:1.65; }
    a { display:inline-block; margin-top:1rem; color:#5eead4; font-weight:700; }
    [data-state="error"] .mark { color:#450a0a; background:#fca5a5; }
  </style>
</head>
<body>
  <main id="confirmation" aria-live="polite">
    <div class="mark" aria-hidden="true">✓</div>
    <h1 id="title">Confirming…</h1>
    <p id="message">We’re confirming your email address and preparing access.</p>
    <a id="destination" href="./" hidden>Open the explorer →</a>
  </main>
  <script type="module">
    const panel = document.getElementById("confirmation");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const destination = document.getElementById("destination");
    const endpoint = document.querySelector('meta[name="confirm-url"]').content;
    const token = new URLSearchParams(location.hash.slice(1)).get("token");
    history.replaceState(null, "", location.pathname);

    async function confirm() {
      if (!token) throw new Error("This confirmation link is incomplete.");
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Confirmation failed");
      title.textContent = "Email confirmed.";
      message.textContent = payload.message;
      destination.hidden = false;
    }

    confirm().catch((error) => {
      panel.dataset.state = "error";
      title.textContent = "Unable to confirm.";
      message.textContent = error.message || "This confirmation link is invalid or expired.";
      destination.textContent = "Request a new link →";
      destination.href = "./register.html";
      destination.hidden = false;
    });
  </script>
</body>
</html>
